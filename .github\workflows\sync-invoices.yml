name: Számlák szinkronizálása

on:
  schedule:
    # Óránként, a whole hour-tól kicsit eltolva (GitHub cron gyakran csúszik
    # pontban egész órakor, a :07 kevésbé zsúfolt időpont)
    - cron: "7 * * * *"
  workflow_dispatch: {}   # kézi indítás a GitHub felületén, teszteléshez

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Függőségek telepítése
        run: pip install -r requirements.txt

      - name: Szinkronizálás futtatása
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          WP_SYNC_URL: ${{ secrets.WP_SYNC_URL }}
          WP_SYNC_API_KEY: ${{ secrets.WP_SYNC_API_KEY }}
        run: python sync_invoices.py
