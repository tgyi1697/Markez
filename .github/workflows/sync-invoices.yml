name: Számlák szinkronizálása

on:
  schedule:
    # Óránként, csak munkaidőben — UTC 4:00–14:00, ami nyári időszámításkor
    # (CEST, UTC+2) budapesti 6:00–16:00-nak felel meg. Télen (CET, UTC+1)
    # ez 1 órával korábbra csúszik (5:00–15:00 helyi idő) — ezt direkt nem
    # kezeljük két külön cronnal, hogy a logika egyszerű maradjon; a napi
    # email időzítése emiatt nem a pontos óratól függ (lásd lent).
    - cron: "7 4-14 * * 1-5"
  workflow_dispatch:      # kézi indítás a GitHub felületén, teszteléshez
    inputs:
      send_test_email:
        description: "Napi összesítő teszt-email küldése is ennél a futásnál"
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Függőségek telepítése
        run: pip install -r requirements.txt

      - name: Szinkronizálás futtatása
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          WP_SYNC_URL: ${{ secrets.WP_SYNC_URL }}
          WP_SYNC_API_KEY: ${{ secrets.WP_SYNC_API_KEY }}
          SMTP_SERVER: we005.tarhely.com
          SMTP_PORT: "465"
          SMTP_USER: szamla@markez.hu
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_DAILY_SUMMARY: ${{ github.event.inputs.send_test_email == 'true' }}
        run: python sync_invoices.py
