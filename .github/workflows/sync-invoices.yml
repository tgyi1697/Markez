name: Számlák szinkronizálása

on:
  schedule:
    # Óránként, a whole hour-tól kicsit eltolva (GitHub cron gyakran csúszik
    # pontban egész órakor, a :07 kevésbé zsúfolt időpont)
    - cron: "7 * * * *"
    # Napi számla-összesítő email — cél: 06:12 magyar idő. A GitHub cron
    # UTC-ben fut és nem ismeri a nyári/téli időszámítást, ezért két,
    # egy órával eltolt cronra van szükség; a script dönti el a mai
    # budapesti UTC-eltolás alapján, hogy melyik "az igazi" — nem a
    # tényleges órától függően, mert a GitHub ütemezett futásai néha
    # (akár jelentősen) csúszhatnak (lásd DAILY_SCHEDULE_CRON lent és
    # sync_invoices.py is_correct_daily_cron()).
    - cron: "12 5 * * *"   # 06:12 CET (téli időszámítás, UTC+1)
    - cron: "12 4 * * *"   # 06:12 CEST (nyári időszámítás, UTC+2)
  workflow_dispatch:      # kézi indítás a GitHub felületén, teszteléshez
    inputs:
      send_test_email:
        description: "Napi összesítő teszt-email küldése is ennél a futásnál"
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Függőségek telepítése
        run: pip install -r requirements.txt

      - name: Szinkronizálás futtatása
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          WP_SYNC_URL: ${{ secrets.WP_SYNC_URL }}
          WP_SYNC_API_KEY: ${{ secrets.WP_SYNC_API_KEY }}
          SMTP_SERVER: we005.tarhely.com
          SMTP_PORT: "465"
          SMTP_USER: szamla@markez.hu
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DAILY_SCHEDULE_CRON: ${{ github.event.schedule }}
          FORCE_DAILY_SUMMARY: ${{ github.event.inputs.send_test_email == 'true' }}
        run: python sync_invoices.py
